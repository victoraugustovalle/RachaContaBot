name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore RachaContas.slnx
      - name: Build
        run: dotnet build RachaContas.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test RachaContas.slnx --no-build --configuration Release
